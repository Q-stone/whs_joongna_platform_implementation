server {
    listen 8082;
    server_name _;

    # 보안 헤더
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 기본 모든 요청은 Apache 역프록시. 아래 location 들만 Nginx 직접 처리.
    # 순서: prefix(^~) > 정규식(~) > 일치(location /)

    # 업로드 미디어: Nginx 직접 서빙(정적) + PHP 실행 완전 차단 (웹셸 원천 방어)
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; return 403; }
        proxy_pass http://apache:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # phpresources 폴더 직접 접근 금지 (PHP 상수 + Apache + Nginx 삼중 차단)
    location ^~ /phpresources/ {
        deny all;
        return 403;
    }

    # 정적 자원: Nginx에서 직접 서빙 (Apache 부하 감소) + 캐싱
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|mp4|webm|mov)$ {
        root /var/www/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 그 외 모든 요청(PHP 포함, /, /?mode=...): Apache 역프록시
    location / {
        client_max_body_size 30M;
        proxy_pass http://apache:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}