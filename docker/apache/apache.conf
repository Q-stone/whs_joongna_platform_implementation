<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # 그룹/소유자 권한 문제 방지
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # uploads 디렉토리의 PHP 실행 차단 (웹셸 원천 차단)
    <DirectoryMatch "^/var/www/html/uploads">
        php_admin_flag engine off
        AddType text/plain .php .php3 .php4 .php5 .php7 .php8 .phtml .pht .phar .inc .htaccess
        Options -ExecCGI -Indexes
        RemoveHandler .php .php3 .php4 .php5 .php7 .php8 .phtml .pht
        <FilesMatch "\.(php|php3|php4|php5|php7|php8|phtml|pht|phar|inc)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    # phpresources 폴더 직접차단 (PHP 상수 + Apache 차단 이중)
    <Directory /var/www/html/phpresources>
        Require all denied
    </Directory>

    # 글로벌 보안 헤더
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # 디렉토리 인덱싱 비활성화 (WebDAV/"Index of" 차단)
    Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>