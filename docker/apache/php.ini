; 엄격 보안/모던 PHP 설정
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/apache2/php_error.log

; 세션 보안 강화
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.cookie_secure = 0
session.gc_maxlifetime = 7200
session.sid_length = 48
session.sid_bits_per_character = 6

; 보안상 악의적 함수 차단
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,putenv

; 업로드 제한 (사진 10MB, 영상 20MB)
file_uploads = On
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 10

; 메모리/시간
memory_limit = 256M
max_execution_time = 30
max_input_time = 60

; OPcache
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 2000

; 멀티바이트
mbstring.language = Korean
mbstring.internal_encoding = UTF-8
mbstring.http_input = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = On
mbstring.detect_order = auto
mbstring.substitute_character = none

[Date]
date.timezone = Asia/Seoul