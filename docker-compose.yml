services:
  nginx:
    image: nginx:1.25-alpine
    container_name: joongna_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:8082"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
      - ./src:/var/www/html:ro
      - uploads_data:/var/www/html/uploads:ro
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - apache
    networks:
      - joongna_net

  apache:
    build:
      context: ./docker/apache
      dockerfile: Dockerfile
    user: "33:33"
    container_name: joongna_apache
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
      - ./docker/apache/apache.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/apache/php.ini:/usr/local/etc/php/conf.d/zz-joongna.ini:ro
      - uploads_data:/var/www/html/uploads
    environment:
      - DB_HOST
      - DB_NAME
      - DB_USER
      - DB_PASS
      - PW_SALT_PRE
      - PW_SALT_POST
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - joongna_net

  mariadb:
    image: mariadb:10.11
    container_name: joongna_mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - TZ=Asia/Seoul
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - joongna_net

networks:
  joongna_net:
    driver: bridge

volumes:
  mariadb_data:
  uploads_data: